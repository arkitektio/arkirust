# ESP32 spike: the arkitekt-mesh core on ESP-IDF. Not part of the workspace,
# not published; see docs/esp32-mesh.md. `cargo check` (nightly + build-std).
[package]
name = "esp32-mesh-spike"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
# The tokio driver, without ring (C): the TLS provider is pure Rust.
arkitekt-mesh = { path = "../../crates/mesh", default-features = false, features = ["tokio"] }
rustls = { version = "0.23", default-features = false, features = ["std"] }
rustls-rustcrypto = "0.0.2-alpha"
tokio = { version = "1", default-features = false, features = ["rt", "io-util"] }
