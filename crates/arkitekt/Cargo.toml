[package]
name = "arkitekt"
description = "Build Arkitekt apps in Rust: declare an App, compose services, serve actions"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[dependencies]
fakts.workspace = true
rath.workspace = true
rekuest.workspace = true
rekuest-macros.workspace = true
anyhow.workspace = true
async-trait.workspace = true
futures.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
dirs.workspace = true
axum = { workspace = true, optional = true }

[features]
default = []
# Serve an app over HTTP + websocket without a rekuest server (`arkitekt::serve`).
serve = ["rekuest/serve", "dep:axum"]
# Join the deployment's mesh with a tailscaled sidecar (`ConnectOptions::mesh`,
# or `ARKITEKT_MESH=1`); needs tailscale installed.
mesh = ["fakts/mesh"]
# `AgentTestClient` for testing served apps.
testing = ["serve", "rekuest/testing"]

[dev-dependencies]
serde.workspace = true
tokio.workspace = true

[[test]]
name = "serve"
required-features = ["testing"]
