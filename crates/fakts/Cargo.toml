[package]
name = "fakts"
description = "Fakts v2 configuration discovery and OAuth2 device-code grant for Arkitekt apps"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

# no_std + alloc unless `std` (default): the login flow runs against a
# `Host` (src/host.rs); with std that is reqwest.
[dependencies]
async-trait.workspace = true
async-lock = { version = "3", default-features = false }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
chrono = { version = "0.4", default-features = false, features = ["alloc", "serde"] }
dirs = { workspace = true, optional = true }
ed25519-dalek = { version = "2", default-features = false }
hashbrown = { version = "0.15", features = ["serde"] }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
rand = { workspace = true, optional = true }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
sha2 = { version = "0.10", default-features = false }
thiserror = { version = "2", default-features = false }
tracing = { version = "0.1", default-features = false }
url = { version = "2", default-features = false }
mesh = { workspace = true, optional = true, features = ["session"] }

# Native: reqwest over rustls, tokio's timers and files (the cache file).
[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
reqwest = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "fs"], optional = true }

# wasm32-unknown-unknown: reqwest over fetch (the browser does TLS), timers
# from JS, randomness from JS; nothing is cached unless the app gives a store.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"], optional = true }
getrandom = { version = "0.2", features = ["js"] }
chrono = { version = "0.4", default-features = false, features = ["wasmbind"] }
gloo-timers = { version = "0.3", features = ["futures"] }
send_wrapper = { version = "0.6", features = ["futures"] }

[features]
default = ["std", "ring", "user-dirs"]
# reqwest as the Host (native and wasm), the file cache, environment
# variables. Without it, give the builder a Host (`FaktsBuilder::host`).
std = [
    "dep:reqwest", "dep:rustls", "dep:tokio", "dep:rand", "async-lock/std", "base64/std",
    "chrono/std", "chrono/clock", "ed25519-dalek/std", "hex/std", "serde/std",
    "serde_json/std", "sha2/std", "thiserror/std", "tracing/std", "url/std",
]
# Install ring as rustls' crypto provider (`install_crypto_provider`). Without
# it the application installs one before connecting (e.g. rustls-rustcrypto on
# ESP-IDF, where ring's C does not build).
ring = ["std", "rustls?/ring"]
# Default places in the user's directories: the fakts cache file
# (`FileStore::default_for`) and the mesh node's state. Without it (e.g. on
# ESP-IDF, which has no users) nothing is cached unless the app gives a store.
user-dirs = ["std", "dep:dirs"]
# Join the deployment's mesh with the `arkitekt-meshd` sidecar
# (`FaktsBuilder::mesh`); mesh aliases are reached through its proxy.
mesh = ["std", "user-dirs", "tokio/process", "tokio/io-util", "tokio/net"]
# Also run the node in-process with our own Tailscale-compatible client
# (`MeshBackend::Native`, the `arkitekt-mesh` crate): no sidecar binary.
mesh-native = ["mesh", "dep:mesh"]
# The native node's TURN relay and TCP forwards (`Fakts::mesh_turn`,
# `Fakts::mesh_forward`), for WebRTC media such as LiveKit.
mesh-relay = ["mesh-native", "mesh/relay"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
axum.workspace = true
futures.workspace = true
tempfile = "3"
tracing-subscriber.workspace = true
