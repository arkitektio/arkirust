[package]
name = "fakts"
description = "Fakts v2 configuration discovery and OAuth2 device-code grant for Arkitekt apps"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[dependencies]
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
dirs.workspace = true
ed25519-dalek.workspace = true
hex.workspace = true
rand.workspace = true
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[features]
default = []
# Join the deployment's mesh with a userspace tailscaled sidecar
# (`FaktsBuilder::mesh`); mesh aliases are reached through its proxy.
mesh = ["tokio/process"]

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
