[package]
name = "rekuest"
description = "Rekuest: runs an Arkitekt app's actions (executor, journal, states) and serves them to a rekuest server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[dependencies]
# Tokens for the link (fakts::TokenLoader).
fakts.workspace = true
rath = { workspace = true, optional = true, default-features = false }
# The declaration this runs: actions, states, hooks, Task, rt.
arkitekt-spec = { workspace = true, features = ["declare"] }
rekuest-protocol.workspace = true
rekuest-session.workspace = true
# no_std + alloc unless `std` (default): every dependency without its own
# defaults, `std` turns them on.
anyhow = { version = "1", default-features = false }
async-trait.workspace = true
chrono = { version = "0.4", default-features = false, features = ["alloc", "serde"] }
futures = { version = "0.3", default-features = false, features = ["alloc", "async-await"] }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
indexmap = { version = "2", default-features = false, features = ["serde"] }
hashbrown = "0.15"
spin = { version = "0.10", default-features = false, features = ["mutex", "spin_mutex", "rwlock", "once"] }
rand = { workspace = true, optional = true }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
sha2 = { version = "0.10", default-features = false }
thiserror = { version = "2", default-features = false }
# Runtime-agnostic waiting and channels; the runtime itself is `rt::Runtime`.
async-channel = { version = "2", default-features = false }
tokio = { workspace = true, features = ["rt", "macros", "sync", "time", "net", "io-util"], optional = true }
tokio-tungstenite = { workspace = true, optional = true }
tracing = { version = "0.1", default-features = false }
uuid = { version = "1", default-features = false, features = ["serde"] }
# The `web` agent: the JS WebSocket and event loop (wasm32).
web-sys = { version = "0.3", features = ["WebSocket", "MessageEvent", "CloseEvent", "Event", "BinaryType"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
gloo-timers = { version = "0.3", features = ["futures"], optional = true }
send_wrapper = { version = "0.6", features = ["futures"], optional = true }
rusqlite = { workspace = true, optional = true }

# wasm32-unknown-unknown: the clock, uuids and random bytes come from JS.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
uuid = { version = "1", default-features = false, features = ["js"] }
chrono = { version = "0.4", default-features = false, features = ["wasmbind"] }

[features]
default = ["std", "wal", "tokio", "rath"]
# Without it the crate is no_std + alloc (embassy): the runtime brings the
# wall clock and randomness (`rt::Runtime`), locks spin, maps are hashbrown's.
std = [
    "rekuest-protocol/std", "anyhow/std", "chrono/std", "chrono/clock", "futures/std",
    "hex/std", "indexmap/std", "dep:rand", "serde/std", "serde_json/std", "sha2/std",
    "thiserror/std", "async-channel/std", "tracing/std", "uuid/std", "uuid/v4", "rath?/std",
    "arkitekt-spec/std",
]
# tokio as the runtime (`rt::Tokio`) and the websocket `Agent` on it (with
# fakts for its tokens). Without it, install a `rt::Runtime` and drive the
# session yourself (`checks/wasm`).
tokio = ["std", "dep:tokio", "dep:tokio-tungstenite", "fakts/std", "arkitekt-spec/tokio"]
# The agent in a browser or node (wasm32): `web::Agent` over the JS WebSocket,
# with fakts for its tokens, and `rt::Js` (the JS event loop) as the runtime.
web = ["std", "arkitekt-spec/js", "fakts/std", "dep:web-sys", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:js-sys", "dep:gloo-timers", "dep:send_wrapper"]
# Actions' GraphQL calls (rath) carry their task's token.
rath = ["dep:rath"]
# Keep the journal in a local SQLite file (write-ahead: unsent reports survive restarts).
wal = ["std", "dep:rusqlite", "tokio"]

[dev-dependencies]
# The state diff is checked against it (src/patch.rs).
json-patch.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "signal", "process"] }
# The tests are an application: they pick ring as the TLS provider.
fakts = { workspace = true, features = ["ring"] }
# The real-stack harness (testing/stack).
reqwest.workspace = true
tempfile = "3"
tracing-subscriber.workspace = true
# The scripted server every driver of the session is tested against.
rekuest-session = { workspace = true, features = ["testing"] }
