[package]
name = "rekuest"
description = "Rekuest agent: expose typed Rust functions as Arkitekt actions"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[dependencies]
fakts = { workspace = true, optional = true }
rath = { workspace = true, optional = true }
rekuest-macros.workspace = true
rekuest-protocol = { workspace = true, features = ["std"] }
rekuest-session.workspace = true
anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
futures.workspace = true
hex.workspace = true
indexmap.workspace = true
json-patch.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
# Runtime-agnostic waiting and channels; the runtime itself is `rt::Runtime`.
async-channel = "2"
tokio = { workspace = true, features = ["rt", "macros", "sync", "time", "net", "io-util"], optional = true }
tokio-tungstenite = { workspace = true, optional = true }
tracing.workspace = true
uuid.workspace = true
axum = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }

# wasm32-unknown-unknown: the clock, uuids and random bytes come from JS.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
uuid = { workspace = true, features = ["js"] }
chrono = { workspace = true, features = ["wasmbind"] }

[features]
default = ["wal", "tokio", "rath"]
# tokio as the runtime (`rt::Tokio`) and the websocket `Agent` on it (with
# fakts for its tokens). Without it, install a `rt::Runtime` and drive the
# session yourself (`checks/wasm`).
tokio = ["dep:tokio", "dep:tokio-tungstenite", "dep:fakts"]
# Actions' GraphQL calls (rath) carry their task's token.
rath = ["dep:rath"]
# Keep the journal in a local SQLite file (write-ahead: unsent reports survive restarts).
wal = ["dep:rusqlite", "tokio"]
# Serve an app over HTTP + websocket without a rekuest server (port of rekuest.contrib.fastapi).
serve = ["wal", "dep:axum"]
# AgentTestClient for testing served apps.
testing = ["serve", "dep:reqwest"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "signal"] }
# The tests are an application: they pick ring as the TLS provider.
fakts = { workspace = true, features = ["ring"] }
reqwest.workspace = true
tempfile = "3"
tracing-subscriber.workspace = true
# The scripted server every driver of the session is tested against.
rekuest-session = { workspace = true, features = ["testing"] }
axum.workspace = true

[[example]]
name = "serve_twin"
required-features = ["serve"]
