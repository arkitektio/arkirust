[package]
name = "rekuest"
description = "Rekuest agent: expose typed Rust functions as Arkitekt actions"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[dependencies]
fakts.workspace = true
rath.workspace = true
rekuest-macros.workspace = true
rekuest-protocol.workspace = true
anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
futures.workspace = true
hex.workspace = true
indexmap.workspace = true
json-patch.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tracing.workspace = true
uuid.workspace = true
axum = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }

[features]
default = ["wal"]
# Keep the journal in a local SQLite file (write-ahead: unsent reports survive restarts).
wal = ["dep:rusqlite"]
# Serve an app over HTTP + websocket without a rekuest server (port of rekuest.contrib.fastapi).
serve = ["wal", "dep:axum"]
# AgentTestClient for testing served apps.
testing = ["serve", "dep:reqwest"]

[dev-dependencies]
reqwest.workspace = true
tempfile = "3"
axum.workspace = true

[[example]]
name = "serve_twin"
required-features = ["serve"]
