[package]
name = "arkitekt-embassy"
description = "Arkitekt apps on embassy: the rekuest agent, fakts' login and rath over embedded-nal-async TCP and TLS, without std"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

# no_std + alloc. The network is embedded-nal-async's (embassy-net's
# TcpClient and DnsSocket on a board, any implementation on a host).
[dependencies]
arkitekt-core.workspace = true
arkitekt-spec = { workspace = true, features = ["declare"] }
anyhow = { version = "1", default-features = false }
rekuest = { workspace = true, features = ["rath"] }
rekuest-session.workspace = true
fakts.workspace = true
async-trait.workspace = true
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
embassy-executor = "0.10"
embassy-futures = "0.1"
embassy-sync = "0.8"
embassy-time = "0.5"
embedded-io-async = "0.7"
embedded-nal-async = "0.9"
rand_core = "0.6"
# TLS 1.3, certificates checked against a given CA (RSA and ECDSA chains).
embedded-tls = { version = "0.19", default-features = false, features = ["rustpki", "p384", "rsa", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
sha1 = { version = "0.10", default-features = false }
spin = { version = "0.10", default-features = false, features = ["mutex", "spin_mutex"] }
tracing = { version = "0.1", default-features = false }
