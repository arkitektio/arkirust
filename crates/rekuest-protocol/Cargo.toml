[package]
name = "rekuest-protocol"
description = "The rekuest agent protocol (/agi): every frame between an agent and the rekuest server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

# no_std + alloc: the agent session core runs on wasm and on embassy too.
# `std` (default) adds `Envelope::new`, which mints a random uuid.
[dependencies]
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
sha2 = { version = "0.10", default-features = false }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
uuid = { version = "1", default-features = false, features = ["v4"], optional = true }

[features]
default = ["std"]
std = ["dep:uuid", "uuid/std", "serde/std", "serde_json/std", "sha2/std", "hex/std"]
