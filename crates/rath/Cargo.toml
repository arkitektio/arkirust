[package]
name = "arkitekt-rath"
description = "Minimal authenticated GraphQL client for Arkitekt services"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[lib]
name = "rath"

# no_std + alloc unless `std` (default): requests go through a `fakts::Host`.
[dependencies]
fakts = { workspace = true }
graphql_client = { workspace = true, optional = true }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
spin = { version = "0.10", default-features = false, features = ["mutex", "spin_mutex"] }
thiserror = { version = "2", default-features = false }
tracing = { version = "0.1", default-features = false }

[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
reqwest = { workspace = true, optional = true }

# wasm32-unknown-unknown: reqwest over fetch (the browser does TLS).
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"], optional = true }

[features]
default = ["std"]
# reqwest as the host, typed operations (graphql_client).
std = [
    "fakts/std", "dep:graphql_client", "dep:reqwest", "serde/std", "serde_json/std",
    "thiserror/std", "tracing/std",
]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
async-trait.workspace = true
wiremock = "0.6"
