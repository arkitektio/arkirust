name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The mesh's end-to-end tests run tailscale's Go test servers and a tsnet peer.
      - uses: actions/setup-go@v5
        with:
          go-version-file: crates/mesh/tests/harness/go.mod
          cache-dependency-path: crates/mesh/tests/harness/go.sum
      # webrtc-sys (lovekit's `livekit` feature, in --all-features) needs
      # clang++ 21 or later (its prebuilt libwebrtc uses Chromium's libc++);
      # Ubuntu's is older, so take it from apt.llvm.org.
      - name: clang 21
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 21
          echo "CC=clang-21" >> "$GITHUB_ENV"
          echo "CXX=clang++-21" >> "$GITHUB_ENV"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features
      - run: cargo test --workspace
      # The mesh is feature-gated, so the plain run above skips it.
      - run: cargo test -p fakts --features mesh
      - run: cargo test -p fakts --features mesh-native

  # The native mesh on every platform meshd ships for.
  mesh-native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p arkitekt --features mesh-native
      - run: cargo test -p arkitekt-mesh --lib

  # The mesh core and driver still build for ESP32-C6 (ESP-IDF, RISC-V).
  mesh-esp32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - run: cargo check
        working-directory: spikes/esp32-mesh

  # Squash-merged PR titles become the commits release-plz reads, so enforce Conventional Commits.
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
