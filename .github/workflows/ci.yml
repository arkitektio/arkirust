name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened]
  # Publish what a release tagged but did not get onto crates.io (e.g. after
  # a failed run); semantic-release then finds nothing new to release.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # fakts' native mesh test runs the mesh's Go harness (tailscale's test
      # control server and a tsnet peer), from the arkitekt-mesh repository.
      - uses: actions/checkout@v4
        with:
          repository: arkitektio/arkitekt-mesh
          # The tag of the arkitekt-mesh version in Cargo.lock.
          ref: v0.7.0
          path: arkitekt-mesh
          sparse-checkout: crates/mesh/tests/harness
      - uses: actions/setup-go@v5
        with:
          go-version-file: arkitekt-mesh/crates/mesh/tests/harness/go.mod
          cache-dependency-path: arkitekt-mesh/crates/mesh/tests/harness/go.sum
      # webrtc-sys (lovekit's `livekit` feature, in --all-features) needs
      # clang++ 21 or later (its prebuilt libwebrtc uses Chromium's libc++);
      # Ubuntu's is older, so take it from apt.llvm.org.
      - name: clang 21
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 21
          echo "CC=clang-21" >> "$GITHUB_ENV"
          echo "CXX=clang++-21" >> "$GITHUB_ENV"
      # ...and GLib's headers (plus those it loads X11/DRM/VA through).
      - run: >-
          sudo apt-get install -y libglib2.0-dev libgbm-dev libdrm-dev libva-dev
          libx11-dev libxext-dev libxfixes-dev libxdamage-dev libxrandr-dev libxcomposite-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features
      - run: cargo test --workspace
      # The mesh is feature-gated, so the plain run above skips it.
      - run: cargo test -p fakts --features mesh
      - run: cargo test -p fakts --features mesh-relay
        env:
          ARKITEKT_MESH_HARNESS: ${{ github.workspace }}/arkitekt-mesh/crates/mesh/tests/harness

  # The SDK on every desktop platform, with the native mesh.
  platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets
      - run: cargo check -p arkitekt --features mesh-relay

  # Against the real servers (testing/stack): lok, rekuest and takt.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            checks/wasm
            checks/embassy
      # The wasm agent's run (checks/wasm under node, from real_rekuest).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall -y --locked wasm-pack
      - run: cargo test -p fakts --test real_lok -- --ignored --nocapture
      # A real agent registers with takt and gets its journal acknowledged:
      # natively, from wasm under node (fakts over fetch, the JS WebSocket),
      # and on embassy (arkitekt-embassy over the host's TCP, no std below).
      - run: cargo test -p rekuest --test real_rekuest -- --ignored --nocapture
      - run: cargo test -p arkitekt-tokio --test real_stack -- --ignored --nocapture

  # The agent stack on the ESP32-S3 (checks/esp32s3): no ring, no signals,
  # no SQLite.
  esp32s3:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: checks/esp32s3
    steps:
      - uses: actions/checkout@v4
      - uses: cargo-bins/cargo-binstall@main
      # From the repository root: the check's rust-toolchain.toml names the
      # toolchain this step installs.
      - name: Xtensa toolchain (esp-1.93)
        working-directory: .
        run: |
          cargo binstall -y --locked espup
          espup install --targets esp32s3 --toolchain-version 1.93.0.0 \
            --name esp-1.93 --export-file "$HOME/export-esp.sh"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: checks/esp32s3
      - run: . "$HOME/export-esp.sh" && cargo check

  # The sans-IO session core on its three runtimes: std is the tokio Agent
  # (the test job); here a minimal driver each for wasm (node) and embassy
  # (on the host, and built for a Cortex-M4F), both running the shared
  # scripted scenario (rekuest_session::testing). On wasm also the whole
  # agent without tokio: a real #[action] through rekuest::Driver.
  controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, thumbv7em-none-eabihf
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            checks/wasm
            checks/embassy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall -y --locked wasm-pack
      # The core itself, without std.
      - run: cargo build -p rekuest-session -p rekuest-protocol -p arkitekt-spec --no-default-features --target thumbv7em-none-eabihf
      - run: cargo build -p rekuest-session -p rekuest-protocol -p arkitekt-spec --no-default-features --target wasm32-unknown-unknown
      # The agent itself (executor, journal, states, #[action]) without tokio,
      # and the browser agent with its login (fakts) and GraphQL client (rath).
      - run: cargo clippy -p rekuest --no-default-features --target wasm32-unknown-unknown -- -D warnings
      # ... and without std, for a microcontroller (embassy).
      - run: cargo clippy -p rekuest -p fakts -p arkitekt-rath -p arkitekt-spec --no-default-features --features rekuest/rath,arkitekt-spec/declare --target thumbv7em-none-eabihf -- -D warnings
      - run: cargo clippy -p arkitekt-embassy -p arkitekt-core --target thumbv7em-none-eabihf -- -D warnings
      # An app on embassy that also depends on arkitekt-spec with its defaults: feature
      # unification turns spec's std on under rekuest built without it.
      - run: cargo check -p arkitekt-embassy -p arkitekt-spec
      - run: cargo clippy -p rekuest -p fakts -p arkitekt-rath --no-default-features --features rekuest/web,rekuest/rath,fakts/std,arkitekt-rath/std --target wasm32-unknown-unknown -- -D warnings
      - run: cargo clippy -p arkitekt-web --target wasm32-unknown-unknown -- -D warnings
      - run: wasm-pack test --node
        working-directory: checks/wasm
      - run: cargo clippy --target wasm32-unknown-unknown --all-targets -- -D warnings
        working-directory: checks/wasm
      - run: cargo run
        working-directory: checks/embassy
      # The board wiring too (arkitekt-embassy over embassy-net).
      - run: cargo clippy --lib --target thumbv7em-none-eabihf -- -D warnings
        working-directory: checks/embassy
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: checks/embassy

  # Squash-merged PR titles become the commits semantic-release reads, so enforce Conventional Commits.
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Every push to main that carries a `feat`, `fix` or `perf` (or a breaking
  # change) is a release, once the jobs above are green: semantic-release
  # (releaserc.toml) bumps the version every crate shares, commits, tags
  # `vX.Y.Z` and creates the GitHub release; then the crates go to crates.io.
  # The mesh (and its Python bindings and meshd) is released from
  # arkitektio/arkitekt-mesh.
  release:
    needs: [test, platforms, esp32s3, controls, e2e]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && github.repository_owner == 'arkitektio'
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write # crates.io trusted publishing
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
      # Sets the `released`, `version` and `tag` outputs.
      - name: semantic-release
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uvx --from python-semantic-release==9.21.1 semantic-release -c releaserc.toml version
      # Publishes every crate whose version is not on crates.io yet, in
      # dependency order (release-plz.toml).
      - uses: release-plz/action@v0.5
        if: steps.version.outputs.released == 'true' || github.event_name == 'workflow_dispatch'
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only needed until trusted publishing is configured on crates.io.
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
