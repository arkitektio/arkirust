name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # fakts' native mesh test runs the mesh's Go harness (tailscale's test
      # control server and a tsnet peer), from the arkitekt-mesh repository.
      - uses: actions/checkout@v4
        with:
          repository: arkitektio/arkitekt-mesh
          # The tag of the arkitekt-mesh version in Cargo.lock.
          ref: v0.7.0
          path: arkitekt-mesh
          sparse-checkout: crates/mesh/tests/harness
      - uses: actions/setup-go@v5
        with:
          go-version-file: arkitekt-mesh/crates/mesh/tests/harness/go.mod
          cache-dependency-path: arkitekt-mesh/crates/mesh/tests/harness/go.sum
      # webrtc-sys (lovekit's `livekit` feature, in --all-features) needs
      # clang++ 21 or later (its prebuilt libwebrtc uses Chromium's libc++);
      # Ubuntu's is older, so take it from apt.llvm.org.
      - name: clang 21
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 21
          echo "CC=clang-21" >> "$GITHUB_ENV"
          echo "CXX=clang++-21" >> "$GITHUB_ENV"
      # ...and GLib's headers (plus those it loads X11/DRM/VA through).
      - run: >-
          sudo apt-get install -y libglib2.0-dev libgbm-dev libdrm-dev libva-dev
          libx11-dev libxext-dev libxfixes-dev libxdamage-dev libxrandr-dev libxcomposite-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features
      - run: cargo test --workspace
      # The mesh is feature-gated, so the plain run above skips it.
      - run: cargo test -p fakts --features mesh
      - run: cargo test -p fakts --features mesh-relay
        env:
          ARKITEKT_MESH_HARNESS: ${{ github.workspace }}/arkitekt-mesh/crates/mesh/tests/harness

  # The native mesh on every platform meshd ships for.
  mesh-native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p arkitekt --features mesh-relay

  # Squash-merged PR titles become the commits semantic-release reads, so enforce Conventional Commits.
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Every push to main that carries a `feat`, `fix` or `perf` (or a breaking
  # change) is a release, once the jobs above are green: semantic-release
  # (releaserc.toml) bumps the version every crate shares, commits, tags
  # `vX.Y.Z` and creates the GitHub release; then the crates go to crates.io.
  # The mesh (and its Python bindings and meshd) is released from
  # arkitektio/arkitekt-mesh.
  release:
    needs: [test, mesh-native]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository_owner == 'arkitektio'
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write # crates.io trusted publishing
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
      # Sets the `released`, `version` and `tag` outputs.
      - name: semantic-release
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uvx --from python-semantic-release==9.21.1 semantic-release -c releaserc.toml version
      # Publishes every crate whose version is not on crates.io yet, in
      # dependency order (release-plz.toml).
      - uses: release-plz/action@v0.5
        if: steps.version.outputs.released == 'true'
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only needed until trusted publishing is configured on crates.io.
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
