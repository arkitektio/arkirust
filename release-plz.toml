# Lockstep releases: every crate shares one version and one `vX.Y.Z` tag.
# semantic-release (releaserc.toml) decides the version, writes CHANGELOG.md,
# tags and creates the GitHub release; release-plz only publishes the crates
# (`release-plz release`, in ci.yml's `release` job).
[workspace]
changelog_update = false
git_release_enable = false
git_tag_enable = false

[[package]]
name = "fakts"
version_group = "arkitekt"

[[package]]
name = "arkitekt-rath"
version_group = "arkitekt"

[[package]]
name = "rekuest-macros"
version_group = "arkitekt"

[[package]]
name = "rekuest-protocol"
version_group = "arkitekt"

[[package]]
name = "rekuest-session"
version_group = "arkitekt"

[[package]]
name = "rekuest"
version_group = "arkitekt"

[[package]]
name = "arkitekt-mikro"
version_group = "arkitekt"

[[package]]
name = "arkitekt-lovekit"
version_group = "arkitekt"

[[package]]
name = "arkitekt"
version_group = "arkitekt"

[[package]]
name = "arkitekt-examples"
release = false
publish = false
