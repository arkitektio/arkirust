[workspace]
resolver = "2"
members = [
    "crates/fakts",
    "crates/rath",
    "crates/rekuest",
    "crates/rekuest-protocol",
    "crates/rekuest-session",
    "crates/embassy",
    "crates/macros",
    "crates/spec",
    "crates/core",
    "crates/tokio",
    "crates/web",
    "crates/serve",
    "crates/arkitekt",
    "crates/mikro",
    "crates/lovekit",
    "examples",
]

[workspace.package]
version = "0.17.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/arkitektio/arkirust"
homepage = "https://github.com/arkitektio/arkirust"
keywords = ["arkitekt", "microscopy", "bioimage", "graphql"]
categories = ["science", "api-bindings"]

[workspace.dependencies]
# Without its `ring` default: the crypto provider is the application's choice
# (arkitekt's `ring` feature, or one the app installs).
fakts = { path = "crates/fakts", version = "0.17.0", default-features = false }
# Without `std` (default): crates that want reqwest and typed queries turn it on.
rath = { path = "crates/rath", version = "0.17.0", package = "arkitekt-rath", default-features = false }
# Without its `wal` default (the SQLite journal, C): arkitekt's `wal` turns it on.
rekuest = { path = "crates/rekuest", version = "0.17.0", default-features = false }
# no_std: crates that want `Envelope::new` turn on `std`.
rekuest-protocol = { path = "crates/rekuest-protocol", version = "0.17.0", default-features = false }
rekuest-session = { path = "crates/rekuest-session", version = "0.17.0" }
arkitekt-macros = { path = "crates/macros", version = "0.17.0" }
# Without `std` and `declare` (both default): only the wire types.
arkitekt-spec = { path = "crates/spec", version = "0.17.0", default-features = false }
arkitekt = { path = "crates/arkitekt", version = "0.17.0" }
arkitekt-core = { path = "crates/core", version = "0.17.0" }
arkitekt-web = { path = "crates/web", version = "0.17.0" }
arkitekt-serve = { path = "crates/serve", version = "0.17.0" }
# Without its defaults (signals, ring, SQLite, user directories): arkitekt's features pick them.
arkitekt-tokio = { path = "crates/tokio", version = "0.17.0", default-features = false }
mikro = { path = "crates/mikro", version = "0.17.0", package = "arkitekt-mikro" }
lovekit = { path = "crates/lovekit", version = "0.17.0", package = "arkitekt-lovekit" }
# Released from its own repository (arkitektio/arkitekt-mesh), not in lockstep.
mesh = { version = "0.7", package = "arkitekt-mesh" }

anyhow = "1"
thiserror = "2"
async-trait = "0.1"
# No features here: each crate names the ones it uses, so the SDK builds for
# targets without signals, threads or a filesystem (ESP-IDF).
tokio = { version = "1", default-features = false }
futures = "0.3"
# TLS through rustls with whatever crypto provider is installed: fakts' `ring`
# feature installs ring; targets ring does not build for install their own.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots-no-provider"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
graphql_client = "0.14"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
ed25519-dalek = "2"
json-patch = "4"
axum = { version = "0.8", features = ["ws"] }
rusqlite = { version = "0.40", features = ["bundled"] }
indexmap = { version = "2", features = ["serde"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "logging"] }
ndarray = "0.17"
zarrs = { version = "0.23", default-features = false, features = ["async", "ndarray", "gzip", "zstd", "sharding", "crc32c", "transpose"] }
zarrs_object_store = "0.7"
object_store = { version = "0.14", features = ["aws"] }

syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
heck = "0.5"
