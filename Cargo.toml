[workspace]
resolver = "2"
members = [
    "crates/fakts",
    "crates/rath",
    "crates/rekuest",
    "crates/rekuest-protocol",
    "crates/rekuest-macros",
    "crates/arkitekt",
    "crates/mikro",
    "crates/lovekit",
    "crates/mesh",
    "crates/meshd",
    "crates/mesh-py",
    "examples",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/arkitektio/arkirust"
homepage = "https://github.com/arkitektio/arkirust"
keywords = ["arkitekt", "microscopy", "bioimage", "graphql"]
categories = ["science", "api-bindings"]

[workspace.dependencies]
fakts = { path = "crates/fakts", version = "0.2.0" }
rath = { path = "crates/rath", version = "0.2.0", package = "arkitekt-rath" }
rekuest = { path = "crates/rekuest", version = "0.2.0" }
rekuest-protocol = { path = "crates/rekuest-protocol", version = "0.2.0" }
rekuest-macros = { path = "crates/rekuest-macros", version = "0.2.0" }
arkitekt = { path = "crates/arkitekt", version = "0.2.0" }
mikro = { path = "crates/mikro", version = "0.2.0", package = "arkitekt-mikro" }
lovekit = { path = "crates/lovekit", version = "0.2.0", package = "arkitekt-lovekit" }
mesh = { path = "crates/mesh", version = "0.2.0", package = "arkitekt-mesh" }

anyhow = "1"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "fs", "signal", "net", "io-util"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
graphql_client = "0.14"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
ed25519-dalek = "2"
json-patch = "4"
axum = { version = "0.8", features = ["ws"] }
rusqlite = { version = "0.40", features = ["bundled"] }
indexmap = { version = "2", features = ["serde"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
ndarray = "0.17"
zarrs = { version = "0.23", default-features = false, features = ["async", "ndarray", "gzip", "zstd", "sharding", "crc32c", "transpose"] }
zarrs_object_store = "0.7"
object_store = { version = "0.14", features = ["aws"] }

syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
heck = "0.5"
