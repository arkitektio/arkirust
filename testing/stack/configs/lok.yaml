kommunity_partners:
  - identifier: little_sidecar
    name: "Sidecar Demo"
    website_url: "https://sidecar.fake"
    partner_kind: "preauthorized"
    auto_configure: true
    preconfigured_hub:
        identifier: localhost
        instances:
        - aliases:
          - challenge: ht
            host: localhost
            id: local_rekuest
            # Rendered by the test harness with rekuest's published host
            # port. This address is handed to the client, which challenges it
            # for real, so it must match the port compose actually published.
            port: __REKUEST_HOST_PORT__
            kind: absolute
            name: demo.arkitekt.live
            scope: public
            ssl: false
          identifier: Rekuest Service
          manifest:
            description: Rekuest Service for Arkitekt Live
            identifier: live.arkitekt.rekuest
            name: Rekuest
            device_id: 47de8b7327024c68820ea042d1bdb37b
            public_sources:
            - kind: github
              url: https://github.com/arkitektio/rekuest-server-next
            roles:
            - description: Can assign to apps
              key: Assigner
            - description: Can review data
              key: Reviewer
            scopes:
            - description: Read access to Rekuest data
              key: read
            - description: Write access to Rekuest data
              key: write
            version: 1.0.0
        