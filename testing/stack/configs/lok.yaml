# Throwaway key material for the integration stack only: generated for this
# file, never used by a deployment. lok refuses to boot on the key and secret
# that used to be copied here from the server repository's committed config.
postgres:
  db_name: lok
  dependency: db
  engine: django.db.backends.postgresql
  host: db
  password: hello_django
  port: 5432
  username: hello_django
deployment:
  name: default
django:
  admin:
    email: admin@admin.com
    password: admin
    username: admin
  debug: true
  hosts:
  - "*"
  secret_key: 7395712029f31c489694c333a7144872b46d4721a22ed94c6a79a5d756a34f33
  csrf_trusted_origins:
  - http://jhnnsrs-lab.hyena-sole.ts.net
  - https://jhnnsrs-lab.hyena-sole.ts.net
  - http://jhnnsrs-server
  - https://jhnnsrs-server
  - http://localhost
  - https://localhost
  force_script_name: ""
authentikate:
  # authentikate 4.0 requires an audience; "*" accepts any.
  audience: "*"
  issuers:
    - kind: rsa
      # lok anchors its discovery endpoints and the `iss` claim of the tokens it
      # mints to `oidc_issuer`, and authentikate looks the verifying key up by
      # that exact string, so both carry the run's host port (rendered by
      # the test harness, like the rekuest port below).
      iss: http://localhost:__LOK_HOST_PORT__
      kid: lok-key-1
      public_key: ssh-rsa 
redis:
  dependency: redis
  host: redis
  port: 6379
scopes:
  kabinet_add_repo: Add repositories to the database
  kabinet_deploy: Deploy containers
  mikro_read: Read image from the database
  mikro_write: Write image to the database
  openid: The open id connect scope
  read: A generic read access
  read_image: Read image from the database
  rekuest_agent: Act as an agent
  rekuest_call: Call other apps with rekuest
  write: A generic write access
token_expire_seconds: 700000

